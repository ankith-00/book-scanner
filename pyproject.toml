[project]
name = "book-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankith", email = "ankith.isadev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask",
    "img2pdf",
    "numpy",
    "opencv-python",
]

[project.scripts]
book-scanner = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
