{% from 'components/macros.html' import mobile_page_item %}

<!-- MOBILE SLIDE-UP REVIEW & EXPORT DRAWER (Solid White, No Heading, 3 Top Action Buttons, Scrollable Document View) -->
<div id="review-drawer"
    class="fixed inset-0 bg-white z-50 flex flex-col px-4 pb-4 md:p-6 transform translate-y-full transition-transform duration-300 ease-out border-t border-neutral-200">
    <div class="max-w-4xl mx-auto w-full text-neutral-900 flex flex-col h-full">

        <!-- Top Controls Row: top gap kept to exactly 1em -->
        <div class="w-full flex items-center justify-between pt-[1em] pb-3 border-b border-neutral-200 shrink-0">
            <!-- 1. Export Button: saves the scanned pages as a PDF -->
            <button id="drawer-download-btn" type="button"
                class="{% if pages | length == 0 %}pointer-events-none opacity-40 bg-neutral-200 text-neutral-400{% else %}bg-neutral-900 hover:bg-neutral-800 text-white{% endif %} font-medium px-5 py-2.5 rounded-[0.4em] text-xs sm:text-sm shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                <span>Export as PDF</span>
            </button>

            <!-- 2. Clear Button -->
            <form action="/clear" method="POST" class="inline m-0">
                <button type="submit"
                    class="bg-red-100 hover:bg-red-200 active:scale-95 text-red-700 hover:text-red-800 border border-red-300 hover:border-red-400 font-medium px-5 py-2.5 rounded-[0.4em] text-xs sm:text-sm shadow-sm transition flex items-center gap-1.5 cursor-pointer">
                    <span>Clear</span>
                </button>
            </form>

            <!-- 3. Resume Button -->
            <button onclick="closeDrawer()"
                class="bg-neutral-100 hover:bg-neutral-200 text-neutral-800 font-medium px-5 py-2.5 rounded-[0.4em] text-xs sm:text-sm border border-neutral-200 transition cursor-pointer">
                Resume
            </button>
        </div>

        <!-- Scrollable Document View (Continuous stream of pages, not in cards) -->
        <div id="mobile-drawer-pages" class="flex-1 overflow-y-auto py-2 flex flex-col items-center space-y-[1.5em] custom-scrollbar">
            {% if pages | length == 0 %}
            <div id="mobile-empty-state" class="py-20 flex flex-col items-center justify-center text-center text-neutral-400">
                <p class="text-sm font-medium text-neutral-600">No pages scanned yet</p>
                <p class="text-xs text-neutral-400 mt-1">Tap the camera button to scan your first spread</p>
            </div>
            {% endif %}

            {% for page_b64 in pages %}
            {{ mobile_page_item(page_b64, loop.index) }}
            {% endfor %}
        </div>
    </div>
</div>
