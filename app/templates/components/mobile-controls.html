<!-- MOBILE FLOATING CONTROLS (< md) - Both buttons pinned near the bottom edge, ~1.5em above it -->
<div class="md:hidden absolute bottom-[1.5em] inset-x-0 z-30 flex items-center justify-between px-6 sm:px-8 pointer-events-none">

    <!-- Left Spacer for Balance (Keeps Shutter Centered) -->
    <div class="w-14 h-14"></div>

    <!-- Native Mobile Camera Shutter Button (Centered) -->
    <button id="mobile-capture-btn"
        class="pointer-events-auto relative group w-20 h-20 rounded-full border-4 border-white flex items-center justify-center p-1.5 active:scale-90 transition-transform focus:outline-none touch-manipulation shadow-2xl bg-black/25 backdrop-blur-sm"
        aria-label="Capture Spread">
        <span id="mobile-shutter-fill" class="w-full h-full rounded-full bg-white transition-all group-active:scale-95 group-active:bg-neutral-300"></span>
        <!-- Capture loader: swaps in for the white shutter fill while the spread uploads -->
        <div id="mobile-capture-spinner" class="hidden absolute inset-0 flex items-center justify-center">
            <div class="w-10 h-10 rounded-full border-4 border-white/80 border-t-transparent animate-spin"></div>
        </div>
    </button>

    <!-- Pages Trigger (Right Bottom Corner, Vertically Aligned with Capture Button) -->
    <button id="mobile-drawer-btn" onclick="openDrawer()"
        class="pointer-events-auto relative w-14 h-14 rounded-full bg-white/95 border border-neutral-200/80 backdrop-blur-md flex items-center justify-center text-neutral-800 active:scale-90 transition-transform shadow-xl touch-manipulation focus:outline-none"
        aria-label="View Scanned Pages">
        <!-- Photo Gallery / Album Icon -->
        <svg class="w-6 h-6 text-neutral-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span id="mobile-badge"
            class="absolute -top-1.5 -right-1.5 bg-white text-neutral-900 text-[10px] font-bold min-w-[20px] h-5 px-1 rounded-full flex items-center justify-center shadow">
            {{ pages | length }}
        </span>
    </button>
</div>
