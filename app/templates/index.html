<!DOCTYPE html>
<html lang="en">

<head>
    {% include 'base/head.html' %}
</head>

<body class="bg-neutral-100 text-neutral-800 m-0 p-0 overflow-hidden h-screen w-screen flex flex-col select-none">

    {% include 'components/header.html' %}

    <!-- DESKTOP PLACEHOLDER: blank white view with a centered black box -->
    <div class="hidden md:flex flex-1 items-center justify-center bg-white">
        <div class="w-[10em] h-[10em] bg-black"></div>
    </div>

    <!-- MAIN APP CONTAINER: mobile scanner stage -->
    <main id="scanner-stage"
        class="md:hidden flex-1 flex flex-col overflow-hidden p-0 mx-auto w-full min-h-0 relative">

        <!-- CAMERA COLUMN: camera-stage renders the feed box (mobile-controls live inside it) -->
        <section class="flex-1 flex flex-col min-w-0 min-h-0 relative h-full p-0 m-0 border-0">
            {% include 'components/camera-stage.html' %}
        </section>

    </main>

    {% include 'components/review-drawer.html' %}

    <!-- SCRIPT LOGIC: order matters (init defines shared refs, then capture, then drawer, then export) -->
    <script>
        {% include 'scripts/init.js.html' %}
        {% include 'scripts/capture.js.html' %}
        {% include 'scripts/drawer.js.html' %}
        {% include 'scripts/export.js.html' %}
    </script>
</body>

</html>
